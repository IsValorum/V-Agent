name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      V_AGENT_NO_AUTO_UPDATE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Interface modules are in sync with index.html
        run: |
          python scripts/sync-ui.py
          git diff --exit-code -- agent/index.html

      - name: Core tests (Python)
        run: python -m unittest discover -s tests -v

      - name: Interface tests (Node)
        shell: bash
        run: for f in tests/*.cjs; do echo "== $f"; node "$f"; done
