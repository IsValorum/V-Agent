name: Feature request
description: An idea to make V-Agent better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could V-Agent help?
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Similar features in other apps, screenshots, links.
